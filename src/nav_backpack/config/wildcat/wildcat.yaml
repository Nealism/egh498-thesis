### Writing misc

# Write a bag file that contains normalized data where all transforms/calibrations have been applied
#  i.e. the bag file will contain data which is all contained within the same frame
# Only data for the following sensors will be kept:
#
#  * IMU
#  * LASER
#
# This is largely for making the data easier to use with when comparing SLAM methods
writeNormalizedBag:
 unusedOverrideSink: &unused_writing_overrides [*unused_override_sink, INIT_FORWARD_AXIS, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS]
 taskMonitor: *task_monitor
 debug: *debug
 type: PIPELINE
 parameters:
  connections:
   bagReader: rawPipeline
   rawPipeline: [streamWriter]
  flushOrder: [bagReader, rawPipeline, streamWriter]
  nodes:
   # Read it
   bagReader:
    type: TEMPORAL_READER
    parameters:
     readers:
      raw: *raw_bag_reader_reader
   # Fix raw data
   rawPipeline: *raw_data_pipeline
   # Write the state given a stream of input data
   streamWriter:
    type: PIPELINE
    parameters:
     dataBox: *data_box_config
     connections:
      input: [windowedStateController, rawOutputFilter]
      rawOutputFilter: writer
      windowedStateController: writer
     flushOrder: [windowedStateController, rawOutputFilter, writer]
     nodes:
      # Project and output all required data as the stream comes in
      windowedStateController:
       type: SIMPLE_WINDOWED_STATE_CONTROLLER
       parameters:
        dataBox: *data_box_config
        state:
         agents:
          default:
           frame:
            baseLink: *base_link_frame
           sensorTree: *full_sensor_tree
        windowDuration: 1.0
        windowBufferDuration: 5.0
        windowShiftDuration: 0.05
        shouldUseTrajectoryTimes: false
        controller:
         type: COMPOUND
         parameters:
          controllers:
           # Transform points to the fixed frame
           cloudTransformer:
            type: POINT_CLOUD_TRANSFORMER
            parameters:
             agents:
              default:
               targetFrame: *base_link_frame
      # Filter the raw data stream to the IMU only, everything else is projected in the windowed controller
      rawOutputFilter:
       type: DATA_FILTER
       parameters:
        filter:
         type: ANY
         parameters:
          filters:
           imu:
            type: IMU
      # Write the data
      writer:
       type: SIMPLE_WRITER
       parameters:
        dataBox: *data_box_config
        writers:
         bag:
          type: ROS_BAG
          parameters:
           filename: "normalized_wildcat.bag"
           writer:
            encoders:
             cloud:
              type: POINT_CLOUD_2
              parameters:
               agents:
                default:
                 frames:
                  base_link:
                   topic: cloud
                   frame: *base_link_frame
                   shouldOutputPositionAsFloat: true
                   shouldOffsetTimesRelativeToHeader: true
                   shouldOutputAttributes: true
             imu:
              type: IMU
              parameters:
               agents:
                default:
                 frames:
                  imu:
                   topic: imu
                   frame: *base_link_frame
# Write out a pointcloud of the baseLink results.
# i.e. a cloud where all points are projected into the baseLink frame of the system.
#
# This is largely for debugging purposes as it requires the system to be stationary to be valid
writeBaseLink:
 unusedOverrideSink: &unused_writing_overrides [*unused_override_sink, INIT_FORWARD_AXIS, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS]
 taskMonitor: *task_monitor
 debug: *debug
 type: PIPELINE
 parameters:
  connections:
   bagReader: rawPipeline
   rawPipeline: [streamWriter]
  flushOrder: [bagReader, rawPipeline, streamWriter]
  nodes:
   # Read it
   bagReader:
    type: TEMPORAL_READER
    parameters:
     readers:
      raw: *raw_bag_reader_reader
   # Fix raw data
   rawPipeline: *raw_data_pipeline
   # Write the state given a stream of input data
   streamWriter:
    type: PIPELINE
    parameters:
     dataBox: *data_box_config
     connections:
      input: windowedStateController
      windowedStateController: writer
     flushOrder: [windowedStateController, writer]
     nodes:
      # Project and output all required data as the stream comes in
      windowedStateController:
       type: SIMPLE_WINDOWED_STATE_CONTROLLER
       parameters:
        dataBox: *data_box_config
        state:
         agents:
          default:
           frame:
            baseLink: *base_link_frame
           sensorTree: *full_sensor_tree
        windowDuration: 1.0
        windowBufferDuration: 5.0
        windowShiftDuration: 0.05
        shouldUseTrajectoryTimes: false
        controller:
         type: COMPOUND
         parameters:
          controllers:
           # Transform points to the fixed frame
           cloudTransformer:
            type: POINT_CLOUD_TRANSFORMER
            parameters:
             agents:
              default:
               targetFrame: *base_link_frame
      # Write the data
      writer:
       type: SIMPLE_WRITER
       parameters:
        dataBox: *data_box_config
        writers:
         cloud:
          type: POINT_CLOUD_STREAM
          parameters:
           filestub: "base_link_wildcat_velodyne"
           writer: *windowed_writer_cloud_writer

### Writing maps

# Write odom results
# @note all of the writers do the same but are templated for the differing inputs/frames/output naming
writeOdom: &write_odom
 unusedOverrideSink: &unused_writing_overrides [*unused_override_sink, INIT_FORWARD_AXIS, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS]
 taskMonitor: *task_monitor
 debug: *debug
 type: TEMPLATE
 parameters:
  # Templated writer for offline results
  # Arguments:
  #   __BAG_READERS__: List of bag readers to read the data from, including raw
  #   __TRAJECTORIES__: State trajectories to use for the projection of the data
  #   __TARGET_FRAME__: Target frame to use (should be the root of the state trajectories frame)
  #   __TRAJ_FILESTUB__: Filestub for the trajectory output
  #   __TRAJ_WITH_ODOM_COV_FILESTUB__ : Filesub for the trajectory with odom covariance output overlaid
  #   __TRAJ_WITH_GLOBAL_COV_FILESTUB__ : Filesub for the trajectory with global covariance output overlaid
  #   __CLOUD_FILESTUB__: Filestub for the pointcloud output
  #   __POSE_EVENT_FILESTUB__: Filestub for pose event output
  #   __PREVIEW_CLOUD_FILESTUB__: Filestub for the preview pointcloud output
  template: &offline_writer_template
   type: PIPELINE
   parameters:
    connections:
     bagReader: rawPipeline
     rawPipeline: [streamWriter]
    flushOrder: [bagReader, rawPipeline, streamWriter]
    nodes:
     # Read it
     bagReader:
      type: TEMPORAL_READER
      parameters:
       readers: __BAG_READERS__
     # Fix raw data
     rawPipeline: *raw_data_pipeline
     # Write the state given a stream of input data
     streamWriter:
      type: PIPELINE
      parameters:
       dataBox: *data_box_config
       connections:
        input: windowedStateController
        windowedStateController: [writer, previewWriter]
       flushOrder: [windowedStateController, writer, previewWriter]
       nodes:
        # Project and output all required data as the stream comes in
        windowedStateController:
         type: SIMPLE_WINDOWED_STATE_CONTROLLER
         parameters:
          dataBox: *data_box_config
          state:
           agents:
            default:
             frame:
              trajectory: __TRAJECTORIES__
              baseLink: *base_link_frame
             sensorTree: *full_sensor_tree
          windowDuration: &windowed_writer_duration 1.0
          windowBufferDuration: &windowed_writer_buffer_duration 10.0
          windowShiftDuration: &windowed_writer_shift_duration 0.9
          shouldUseTrajectoryTimes: &windowed_writer_should_use_trajectory_times true
          controller:
           type: COMPOUND
           parameters:
            controllers:
             # Squash the traj down to the fixed frame
             trajectorySquasher:
              type: TRAJECTORY_SQUASHER
             # Transform odom traj cov into the fixed frame
             trajectoryWithOdomCovTransformer:
              type: POSE_TRANSFORMER
              parameters:
               agents:
                default:
                 transformType: RELATIVE
                 originFrame: *wildcat_odom_pose_estimate_frame
                 targetFrame: __TARGET_FRAME__
                 outputFrame: *wildcat_odom_pose_estimate_frame
             # Transform global traj cov into the fixed frame
             trajectoryWithGlobalCovTransformer:
              type: POSE_TRANSFORMER
              parameters:
               agents:
                default:
                 transformType: RELATIVE
                 originFrame: *wildcat_global_pose_estimate_frame
                 targetFrame: __TARGET_FRAME__
                 outputFrame: *wildcat_global_pose_estimate_frame
             # Transform points to the world frame
             cloudTransformer:
              type: POINT_CLOUD_TRANSFORMER
              parameters:
               agents:
                default:
                 targetFrame: __TARGET_FRAME__
             # Project events to the world frame
             eventProjector:
              type: EVENT_PROJECTOR
              parameters:
               agents:
                default:
                 targetFrame: __TARGET_FRAME__
             # Project pose events to the world frame
             poseEventProjector:
              type: POSE_EVENT_PROJECTOR
              parameters:
               agents:
                default:
                 targetFrame: __TARGET_FRAME__
        # Write the data
        writer:
         type: SIMPLE_WRITER
         parameters:
          dataBox: *data_box_config
          writers:
           writer:
            type: COMPOUND
            parameters:
             writers:
              trajectory:
               type: TRAJECTORY_STREAM
               parameters:
                filestub: __TRAJ_FILESTUB__
                writer: *windowed_writer_traj_writer
              trajectoryWithOdomCov:
               type: DATA_FILTER
               parameters:
                filter:
                 type: POSE_WITH_COVARIANCE
                 parameters:
                  frame: *wildcat_odom_pose_estimate_frame
                writer:
                 type: TRAJECTORY_WITH_COVARIANCE_STREAM
                 parameters:
                  filestub: __TRAJ_WITH_ODOM_COV_FILESTUB__
                  writer: *windowed_writer_traj_with_cov_writer
              trajectoryWithGlobalCov:
               type: DATA_FILTER
               parameters:
                filter:
                 type: POSE_WITH_COVARIANCE
                 parameters:
                  frame: *wildcat_global_pose_estimate_frame
                writer:
                 type: TRAJECTORY_WITH_COVARIANCE_STREAM
                 parameters:
                  filestub: __TRAJ_WITH_GLOBAL_COV_FILESTUB__
                  writer: *windowed_writer_traj_with_cov_writer
              cloud:
               type: POINT_CLOUD_STREAM
               parameters:
                filestub: __CLOUD_FILESTUB__
                writer: *windowed_writer_cloud_writer
              event:
               type: POSE_EVENT_STAMPED_STREAM
               parameters:
                filestub: __POSE_EVENT_FILESTUB__
                writer:
                 type: TEXT
                 parameters:
                  header: "event_id time x y z qw qx qy qz"
                  delimiter: " "
                  shouldEndRowsWithDelimiter: false
                  fileExtension: "txt"
        # Write the preview data
        previewWriter:
         type: CONDITIONAL
         parameters:
          isEnabled: SHOULD_OUTPUT_PREVIEW_CLOUD
          shouldPassThroughWhenDisabled: false
          node:
           type: SIMPLE_WRITER
           parameters:
            dataBox: *data_box_config
            writers:
             writer:
              type: COMPOUND
              parameters:
               writers:
                previewCloud:
                 type: POINT_CLOUD_STREAM
                 parameters:
                  filestub: __PREVIEW_CLOUD_FILESTUB__
                  filter: *windowed_writer_preview_cloud_filter
                  writer: *windowed_writer_preview_cloud_writer
  arguments:
   __BAG_READERS__:
    raw: *raw_bag_reader_reader
    odom: *odom_bag_reader_reader
   __TRAJECTORIES__: [*odom_frame]
   __TARGET_FRAME__: *odom_frame
   __TRAJ_FILESTUB__: "odom_wildcat_traj"
   __TRAJ_WITH_ODOM_COV_FILESTUB__: "odom_wildcat_traj_odom_cov"
   __TRAJ_WITH_GLOBAL_COV_FILESTUB__: "odom_wildcat_traj_global_cov"
