# Online odom
onlineOdom:
 unusedOverrideSink: [*unused_override_sink, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER]
 debug: *debug
 connections:
  rawTopicReader: rawPipeline
  rawPipeline: [odom, outRawFilter, frameGenerator]
  outRawFilter: [odomTailOut, highFreqEstimator]
  odom: [odomTipOut, odomTailOut, highFreqEstimator, frameGenerator, resultWriter]
 flushOrder: [rawTopicReader, rawPipeline, outRawFilter, odom, odomTipOut, odomTailOut, highFreqEstimator, frameGenerator, resultWriter]
 nodes:
  # Get raw data
  rawTopicReader: *raw_topic_reader
  # Fix raw data
  rawPipeline: *raw_data_pipeline
  # Slam it
  odom: &odom_online_filter_and_slam
   type: PIPELINE
   parameters:
    connections:
     input: filter
     filter: slam
     slam: output
    flushOrder: [filter, slam]
    nodes:
     # Filter
     filter: *online_raw_data_filter
     # Slam
     slam: *odom_online
  # Output raw filter
  outRawFilter: *online_output_raw_data_filter
  # Output odom tip
  odomTipOut: *odom_tip_out
  # Output odom tail (final traj and clouds)
  odomTailOut: *odom_tail_out
  # Output high-freq output
  highFreqEstimator: *high_freq_estimator_node
  # Output frames
  frameGenerator:
    type: CONDITIONAL
    parameters:
     isEnabled: SHOULD_OUTPUT_TAIL_ATLAS_FRAMES
     shouldPassThroughWhenDisabled: false
     node:
      type: TEMPLATE
      parameters:
       template: *online_frame_generator_template
       arguments:
        __FRAME_GEN_BASE_LINK__: *base_link_frame
        __FRAME_GEN_PERIOD__: 5.0
        __FRAME_GEN_DURATION__: 6.0
        __FRAME_GEN_BUFFER_DURATION__: 0.25
        __FRAME_GEN_TOPIC__: "slam/odom/frames"
  # Output results for downstream usage
  resultWriter:
   type: CONDITIONAL
   parameters:
    isEnabled: SHOULD_OUTPUT_ONLINE_RESULTS
    shouldPassThroughWhenDisabled: false
    node: *odom_result_writer

# Online odom for the sim, bypassing synchronization
onlineOdomSim:
 unusedOverrideSink: [*unused_override_sink, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_RESULTS]
 debug: *debug
 connections:
  rawTopicReader: rawPipeline
  rawPipeline: [odom, odomTailOut, highFreqEstimator, frameGenerator]
  odom: [odomTipOut, odomTailOut, highFreqEstimator, frameGenerator]
 flushOrder: [rawTopicReader, rawPipeline, odom, odomTipOut, odomTailOut, highFreqEstimator, frameGenerator]
 nodes:
  # Get raw data
  rawTopicReader: *raw_topic_reader_sim
  # Fix raw data
  rawPipeline: *raw_data_filter
  # Slam it
  odom: *odom_online_filter_and_slam
  # Output odom tip
  odomTipOut: *odom_tip_out
  # Output odom tail (final traj and clouds)
  odomTailOut: *odom_tail_out
  # Output high-freq output
  highFreqEstimator: *high_freq_estimator_node
  # Output frames
  frameGenerator:
   type: TEMPLATE
   parameters:
    template: *online_frame_generator_template
    arguments:
     __FRAME_GEN_BASE_LINK__: *base_link_frame
     __FRAME_GEN_PERIOD__: 5.0
     __FRAME_GEN_DURATION__: 6.0
     __FRAME_GEN_BUFFER_DURATION__: 0.25
     __FRAME_GEN_TOPIC__: "slam/odom/frames"

# Online atlas
# This does NOT share with any other agents
onlineAtlas:
 unusedOverrideSink: [*unused_override_sink, ADDITIONAL_SELF_STRIKE_FILTER, ENCODER_CALIBRATION_VALUES, ENCODER_FIXED_STATIC_TRANSFORM_POSE_OFFSET, ENCODER_ROTATING_DYNAMIC_TRANSFORM_TIME_OFFSET, IMU_IMU_ANGULAR_VELOCITY_TIME_OFFSET, IMU_IMU_LINEAR_ACCELERATION_TIME_OFFSET, IMU_STATIC_TRANSFORM_POSE_OFFSET, INIT_FORWARD_AXIS, LASER_CALIBRATION_VALUES, PREVIEW_CLOUD_VOXEL_RESOLUTION, SELF_STRIKE_SPHERICAL_IMAGE_VALUES, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SPHERE_ORIGIN, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_PREVIEW_CLOUD, TIMING_STD_DEV, TRANSFORM_STD_DEV, VELODYNE_FILTER, VELODYNE_LASER_TIME_OFFSET, VELODYNE_STATIC_TRANSFORM_POSE_OFFSET]
 debug: *debug
 connections:
  frameReader: atlas
  atlas: trajResampler
  trajResampler: resultWriter
 flushOrder: [frameReader, atlas, trajResampler, resultWriter]
 nodes:
  # Get frames
  frameReader: &online_atlas_frame_reader
   type: SIMPLE_READER
   parameters:
    dataBox:
     in:
      isThreaded: true
    readers:
     rosbag:
      type: ROS_TOPIC
      parameters:
       reader:
        agents:
         AGENT_NAME:
          decoders:
           ros:
            type: ATLAS_LOSSY_SAX_NO_TIMING_FRAME
            topics: ["slam/odom/frames"]
            parameters: &frame_decoder
             frame: *base_link_frame
  # Slam it
  atlas:
   type: SIMPLE_ATLAS_OPTIMIZER
   parameters:
    dataBox:
     in:
      isThreaded: true
    state:
     agents:
      default:
       frame:
        optimization: *atlas_frame
        trajectory: *odom_frame
        baseLink: *base_link_frame
       sensorTree:
        transforms: {}
        sensors:
         base_link:
          type: ATLAS_FRAME
    shouldOutputOptimizedTrajectoriesOnFlush: SHOULD_OUTPUT_ONLINE_RESULTS
    controller:
     type: COMPOUND
     parameters:
      controllers:
       tfCorrection:
        type: ROS_GLOBAL_CORRECTION_TF_PUBLISHER
        parameters:
         agents:
          AGENT_NAME:
           topic: "tf"
           globalFrame: *tf_map_frame
           localFrame: odom
       mapServer:
        type: ROS_ATLAS_MAP_SERVER
        parameters:
         ns: slam/map
       mapClearer:
        type: ROS_CLEAR_MAP_SERVICE
        parameters:
         service: slam/map/clear
       agentClearer:
        type: ROS_CLEAR_AGENT_SERVICE
        parameters:
         service: /slam_atlas_map/clear_agent
    agents:
     default:
      frameAttemptPeriod: 0.0
      frameProvider:
       type: FRAME_SENSOR
       parameters:
        shouldUsePoseInData: true
    map: *atlas_optimizer_map
  # Resample the trajectory so it plays nice with down-stream users
  trajResampler: *atlas_traj_resampler
  # Output results for downstream usage
  resultWriter:
   type: CONDITIONAL
   parameters:
    isEnabled: SHOULD_OUTPUT_ONLINE_RESULTS
    shouldPassThroughWhenDisabled: false
    node: *atlas_result_writer

# Write basemaps using the various results
# Odom basemap
writeBasemapOdom: &write_basemap_odom
 unusedOverrideSink: &unused_writing_overrides [*unused_override_sink, INIT_FORWARD_AXIS, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS]
 taskMonitor: *task_monitor
 debug: *debug
 type: TEMPLATE
 parameters:
  # Templated writer for offline results
  # Arguments:
  #   __BAG_READERS__: List of bag readers to read the data from, including raw
  #   __AGENT_TRAJECTORIES__: State trajectories to use for the projection of the data
  #   __TARGET_FRAME__: Target frame to use
  template: &write_basemap_template
   type: PIPELINE
   parameters:
    connections:
     bagReader: rawPipeline
     rawPipeline: temporalSorter
     temporalSorter: [frameGenerator]
     frameGenerator: agentRenamer
     agentRenamer: atlas
    flushOrder: [bagReader, rawPipeline, temporalSorter, frameGenerator, agentRenamer, atlas]
    nodes:
     # Read it
     bagReader:
      type: TEMPORAL_READER
      parameters:
       readers: __BAG_READERS__
     # Fix raw data
     rawPipeline: *raw_data_pipeline
     # Sort the times
     temporalSorter:
      type: TEMPORAL_SORTER
      parameters:
       bufferDuration: 5.0
     # Gen frames
     frameGenerator:
      type: TEMPLATE
      parameters:
       template: *frame_generator_template
       arguments:
        __BASE_LINK__: *base_link_frame
        __TRAJECTORIES__: __AGENT_TRAJECTORIES__
        __OUTPUT_PARENT_POSE_FRAME__: __TARGET_FRAME__
        __FRAME_PERIOD__: 5.0
        __FRAME_DURATION__: 6.0
        __FRAME_BUFFER_DURATION__: 0.25
     # Rename the agent to the fixed name for querying later on
     agentRenamer:
      type: AGENT_RENAMER
      parameters:
       agents:
        default:
         frame: &basemap_agent_frame "basemap/wildcat"
     # Generate atlas graph
     # This does no optimization and can not change the poses
     atlas:
      type: SIMPLE_ATLAS_OPTIMIZER
      parameters:
       dataBox:
        in:
         isThreaded: true
         maxQueueDuration: 30
       state:
        agents:
         default:
          frame:
           optimization: basemap
           trajectory: __AGENT_TRAJECTORIES__
           baseLink: *base_link_frame
          sensorTree:
           transforms: {}
           sensors:
            base_link:
             type: ATLAS_FRAME
       agents:
        default:
         frameAttemptPeriod: 0.0
         frameProvider:
          type: FRAME_SENSOR
          parameters:
           shouldUsePoseInData: true
       controller:
        type: COMPOUND
        parameters:
         controllers: {}
       map:
        type: SIMPLE
        parameters:
         # If we should merge into the last frame, increases processing speed at the cost of accuracy
         shouldAllowImmediateMergeIntoLastNode: true
         # If empty frames should be merged
         shouldMergeEmptyFrames: true
         # The maximum distance between empty frames when merging, this causes the graph to maintain flexibility for large traversals of empty.
         maxEmptyFrameMergeDistance: 10.0
         # Threshold for merging frames with each other, done via the overlap metric (normals taken into account)
         minOverlapMergeThreshold: 0.5
         # Mah dist which determines when a frame is overlapping, this is the mah dist between the bounds of the 2
         maxMahalanobisDistanceOverlapThreshold: *max_mah_dist_bounds
         # Disable guess alignment under the assumption the map is correct
         highConfidencePositionUncertaintyStdDevThreshold: 9999999999
         highConfidenceRotationUncertaintyStdDevThreshold: 9999999999
         # If wildcat rejects edges that means it's too confident in the edges (confidenceOffset) or there's not enough overlap (confidenceBounds), increasing makes it more accept larger errors
         maxMahalanobisDistanceHighConfidenceOffset: *max_mah_dist_offset
         maxMahalanobisDistanceHighConfidenceBounds: *max_mah_dist_bounds
         maxMahalanobisDistanceLowConfidenceOffset: *max_mah_dist_offset
         maxMahalanobisDistanceLowConfidenceBounds: *max_mah_dist_bounds
         # General config
         shouldRefineMerges: false
         shouldPruneChildrenNodes: true
         # Disable all optimization
         optimization:
          problem:
           solver:
            type: STATIC_LINEAR
            parameters:
             maxNumIterations: 0
             iterationConvergenceThreshold: 0.01
             enableSafetyChecks: false
             dampingFactor: 0.01
           optimization:
            minNumIterations: 0
            maxNumIterations: 0
            iterationConvergenceThreshold: 0.01
           constraints: {}
         agents:
          default:
           offset: [0,0,0, 1,0,0,0]
           confidences:
            odometry:
             stdDev: [0.01, 0.1]
            upVector:
             stdDev: 1.0
         confidences: *atlas_confidences
         basemapManager:
          type: SIMPLE
          parameters:
           inputFilename: "" # Do not read a basemap for generation
           outputFilename: BASEMAP_OUTPUT_FILE
         # Use the standard configs, except accept all fine alignments, the verifier will fail if not enough overlap which means the connectivity will remain valid
         boundsComputer: *atlas_bounds_computer
         covarianceComputer: *atlas_covariance_computer
         fineAligner:
          type: PASS_THROUGH
         fineAlignmentVerifier: *atlas_fine_alignment_verifier
         overlapDetector: *atlas_overlap_detector
         merger: *atlas_merger
  arguments:
   __TARGET_FRAME__: *odom_frame
   __BAG_READERS__:
    raw: *raw_bag_reader_reader
    odom: *odom_bag_reader_reader
   __AGENT_TRAJECTORIES__: [*odom_frame]
