# Online atlas with a basemap, the basemap used is configured via the overrides
# This does NOT share with any other agents
onlineAtlasWithBasemap:
 unusedOverrideSink: [*unused_override_sink, ADDITIONAL_SELF_STRIKE_FILTER, ENCODER_CALIBRATION_VALUES, ENCODER_FIXED_STATIC_TRANSFORM_POSE_OFFSET, ENCODER_ROTATING_DYNAMIC_TRANSFORM_TIME_OFFSET, IMU_IMU_ANGULAR_VELOCITY_TIME_OFFSET, IMU_IMU_LINEAR_ACCELERATION_TIME_OFFSET, IMU_STATIC_TRANSFORM_POSE_OFFSET, INIT_FORWARD_AXIS, LASER_CALIBRATION_VALUES, PREVIEW_CLOUD_VOXEL_RESOLUTION, SELF_STRIKE_SPHERICAL_IMAGE_VALUES, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SPHERE_ORIGIN, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_PREVIEW_CLOUD, TIMING_STD_DEV, TRANSFORM_STD_DEV, VELODYNE_FILTER, VELODYNE_LASER_TIME_OFFSET, VELODYNE_STATIC_TRANSFORM_POSE_OFFSET]
 debug: *debug
 connections:
  frameReader: atlas
  atlas: trajResampler
  trajResampler: resultWriter
 flushOrder: [frameReader, atlas, trajResampler, resultWriter]
 nodes:
  # Get frames
  frameReader: *online_atlas_frame_reader
  # Slam it
  atlas:
   type: SIMPLE_ATLAS_OPTIMIZER
   parameters:
    dataBox:
     in:
      isThreaded: true
    state:
     agents:
      default:
       frame:
        optimization: *atlas_frame
        trajectory: *odom_frame
        baseLink: *base_link_frame
       sensorTree:
        transforms: {}
        sensors:
         base_link:
          type: ATLAS_FRAME
    shouldOutputOptimizedTrajectoriesOnFlush: SHOULD_OUTPUT_ONLINE_RESULTS
    controller:
     type: COMPOUND
     parameters:
      controllers:
       # Only publish tf if connected to the basemap
       tfCorrection:
        type: ROS_GLOBAL_CORRECTION_TF_PUBLISHER
        parameters:
         agents:
          AGENT_NAME:
           topic: "tf"
           globalFrame: *tf_map_frame
           localFrame: odom
           requiredAgentConnections: [*basemap_agent_frame]
       mapServer:
        type: ROS_ATLAS_MAP_SERVER
        parameters:
         ns: slam/map
       mapClearer:
        type: ROS_CLEAR_MAP_SERVICE
        parameters:
         service: slam/map/clear
       agentClearer:
        type: ROS_CLEAR_AGENT_SERVICE
        parameters:
         service: /slam_atlas_map/clear_agent
       # Publish connectivity if localized
       agentConnectivityPublisher:
        type: ROS_AGENT_CONNECTIVITY_PUBLISHER
        parameters:
         areAllAgentsConnectedTopic: ""
         connectionSets:
          -
           agents: [AGENT_NAME, *basemap_agent_frame]
           areAllAgentsConnectedTopic: slam/map/is_localized_to_basemap
       # Initial pose inputs (disabled by default)
       sameStartPoseHintProvider: ATLAS_SAME_START_POSE_PROVIDER
       initialPoseSupplier: ATLAS_INITIAL_POSE_PROVIDER
       # Allow map-frame hint inputs
       basemapHintProvider:
        type: ROS_BASEMAP_POSE_HINT_PROVIDER
        parameters:
         service: slam/map/add_basemap_hint
         maxMahalanobisBoundsDistance: 1.7320508075688772
       # Allow map-frame hint inputs
       hintProvider:
        type: ROS_POSE_HINT_PROVIDER
        parameters:
         service: slam/map/add_hint
    agents:
     default:
      frameAttemptPeriod: 0.0
      frameProvider:
       type: FRAME_SENSOR
       parameters:
        shouldUsePoseInData: true
    map:
     type: SIMPLE
     parameters:
      # If we should merge into the last frame, increases processing speed at the cost of accuracy
      shouldAllowImmediateMergeIntoLastNode: true
      # If empty frames should be merged
      shouldMergeEmptyFrames: true
      # The maximum distance between empty frames when merging, this causes the graph to maintain flexibility for large traversals of empty.
      maxEmptyFrameMergeDistance: 10.0
      # Threshold for merging frames with each other, done via the overlap metric (normals taken into account)
      minOverlapMergeThreshold: 0.5
      # Mah dist which determines when a frame is overlapping, this is the mah dist between the bounds of the 2
      maxMahalanobisDistanceOverlapThreshold: &max_mah_dist_bounds 1.0
      # The errors are the tolerances where sax icp will work, after that loop-closure stuff kicks in
      highConfidencePositionUncertaintyStdDevThreshold: 1.0
      highConfidenceRotationUncertaintyStdDevThreshold: 15.0
      # If wildcat rejects edges that means it's too confident in the edges (confidenceOffset) or there's not enough overlap (confidenceBounds), increasing makes it more accept larger errors
      maxMahalanobisDistanceHighConfidenceOffset: &max_mah_dist_offset 1.7320508075688772
      maxMahalanobisDistanceHighConfidenceBounds: *max_mah_dist_bounds
      maxMahalanobisDistanceLowConfidenceOffset: *max_mah_dist_offset
      maxMahalanobisDistanceLowConfidenceBounds: *max_mah_dist_bounds
      # General config
      shouldRefineMerges: true
      shouldPruneChildrenNodes: true
      # connectivityGraphFilename: map.atlas # Set prune to false to get the full map
      # Allow duplicate frames (id && pose) to be ignored, the cause is currently unknown, but it's most likely comms related
      shouldIgnoreIdenticalFrames: true
      # Clear an agent if it recieves a clashing frame id, usually when it's rebooted or something
      shouldClearAgentOnFrameIdClash: true
      # Clear an agent if it recieves a frame id lower then the last, usually when it's rebooted or something
      shouldClearAgentOnFrameIdDecrement: true
      optimization: *online_atlas_optimizer_optimization
      agents:
       default:
        offset: [0,0,0, 1,0,0,0]
        confidences:
         odometry:
          stdDev: [0.01, 0.1]
         upVector:
          stdDev: 1.0
      confidences: *atlas_confidences
      # Force basemap usage
      basemapManager:
       type: SIMPLE
       parameters:
        inputFilename: BASEMAP_INPUT_FILE
        outputFilename: "" # Do not write the basemap for online usage
        shouldFixNodes: true
        shouldFailWhenMissing: true
      boundsComputer: *atlas_bounds_computer
      covarianceComputer: *atlas_covariance_computer
      fineAligner: *atlas_fine_aligner
      # Verification for fine alignments
      fineAlignmentVerifier: *atlas_fine_alignment_verifier
      overlapDetector: *atlas_overlap_detector
      merger: *atlas_merger
      guessAligner: &atlas_guess_aligner
       type: REFINER
       parameters:
        shouldRemoveFailedFineAlignments: true
        guessAligner:
         type: EGI_FOURIER
         parameters:
          resolution: 0.4
          angularResolution: 1
          gridResolution: 1.0
          gridMaxRadius: 30
        fineAligner: *atlas_fine_aligner
      # Verification for guess alignments
      guessAlignmentVerifier: *atlas_fine_alignment_verifier
      hypothesisVerifier: *atlas_hyp_verifier
  # Resample the trajectory so it plays nice with down-stream users
  trajResampler: *atlas_traj_resampler
  # Output results for downstream usage
  resultWriter:
   type: CONDITIONAL
   parameters:
    isEnabled: SHOULD_OUTPUT_ONLINE_RESULTS
    shouldPassThroughWhenDisabled: false
    node: *atlas_result_writer

# Generate a self strike spherical image mask from a bag
generateSelfStrikeSphericalImage:
 unusedOverrideSink: [*unused_override_sink, INIT_FORWARD_AXIS, PREVIEW_CLOUD_VOXEL_RESOLUTION, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS, SHOULD_OUTPUT_PREVIEW_CLOUD]
 debug: *debug
 taskMonitor: *task_monitor
 connections:
  rawBagReader: rawPipeline
  rawPipeline: generator
 flushOrder: [rawBagReader, rawPipeline, generator]
 nodes:
  # Get raw data
  rawBagReader: *raw_bag_reader
  # Fix raw data
  rawPipeline: *raw_data_pipeline
  # Generate it
  generator: &self_strike_image_generator
   type: SIMPLE_STATE_WRITER
   parameters:
    state: *base_link_state
    writers:
     selfStrikeSphericalImage:
      type: SELF_STRIKE_SPHERICAL_IMAGE
      parameters:
       targetFrame: *base_link_frame
       sphereOrigin: *self_strike_sphere_origin
       filestub: "self_strike"
       width: 360
       height: 180
       blurRadius: 5
       filter: SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER

# Generate a self strike spherical image mask from a bag of sim data
# This is the same as above but reading from sim bags and not doing timing corrections etc.
generateSelfStrikeSphericalImageSim:
 unusedOverrideSink: [*unused_override_sink, INIT_FORWARD_AXIS, PREVIEW_CLOUD_VOXEL_RESOLUTION, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS, SHOULD_OUTPUT_PREVIEW_CLOUD]
 debug: *debug
 connections:
  rawBagReader: rawPipeline
  rawPipeline: generator
 flushOrder: [rawBagReader, rawPipeline, generator]
 nodes:
  # Get raw data
  rawBagReader: *raw_bag_reader_sim
  # Fix raw data without timing
  rawPipeline: *raw_data_filter
  # Generate it
  generator: *self_strike_image_generator

# Perform a static calibration, placing the new calibration into static_calibration.yaml
# This assumes the system is static during the ENTIRE scan, and placed into the designated location as per the benchmark scan.
# This calibrates errors in the encoders and lasers.
staticCalibration:
 unusedOverrideSink: [*unused_override_sink, INIT_FORWARD_AXIS, PREVIEW_CLOUD_VOXEL_RESOLUTION, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS, SHOULD_OUTPUT_PREVIEW_CLOUD]
 debug: *debug
 taskMonitor: *task_monitor
 connections:
  rawBagReader: rawPipeline
  rawPipeline: calibrator
 flushOrder: [rawBagReader, rawPipeline, calibrator]
 nodes:
  # Get raw data
  rawBagReader: *raw_bag_reader
  # Fix raw data
  rawPipeline: *raw_data_pipeline
  # Calibrate
  calibrator:
   type: SIMPLE_STATE_CONTROLLER
   parameters:
    state: *base_link_state
    controller:
     type: LASER_CALIBRATOR
     parameters:
      pose: [0,0,0, 1,0,0,0]
      featureResolution: 0.4
      referenceCloudFilename: "bench_points.txt"
      numIterations: 25
      encoderFixedFrame: *encoder_fixed_frame
      encoderRotatingFrame: *encoder_rotating_frame
      numRings: 16
      outputFilename: "static_calibration.yaml"
      # Dodgy VLP-16 have missing beams so print a warning rather than aborting the calib.
      shouldAssertNumRings: false

# Perform a dynamic calibration, placing the new calibration into dynamic_calibration.yaml
# This assumes the system has all axes excited during the scan (calibration dance).
# This calibrates timing and pose extrinsincs for the entire system.
dynamicCalibration:
 unusedOverrideSink: [*unused_override_sink, PREVIEW_CLOUD_VOXEL_RESOLUTION, SHOULD_FILTER_ATLAS_FRAME_OUTPUT, SHOULD_FILTER_ONLINE_POINT_CLOUD_OUTPUT, SHOULD_OUTPUT_ONLINE_MAPS, SHOULD_OUTPUT_ONLINE_RESULTS, SHOULD_OUTPUT_PREVIEW_CLOUD, SELF_STRIKE_SPHERICAL_IMAGE_GENERATION_SELF_FILTER]
 debug: *debug
 taskMonitor: *task_monitor
 connections:
  rawBagReader: rawPipeline
  rawPipeline: slam
  slam: writer
 flushOrder: [rawBagReader, rawPipeline, slam, writer]
 nodes:
  # Get raw data
  rawBagReader: *raw_bag_reader
  # Fix raw data
  rawPipeline: *raw_data_pipeline
  # Slam it
  slam:
   type: SIMPLE_WINDOWED_TRAJECTORY_OPTIMIZER
   parameters:
    dataBox: *data_box_config
    shouldPrintState: true
    shouldEstimateTrajectory: true
    trajectoryEstimator: *traj_estimator_imu
    state:
     agents:
      default:
       frame:
        optimization: *odom_frame
        baseLink: *base_link_frame
       sensorTree: *full_sensor_tree
    optimization:
     windowDuration: 60
     windowShiftDuration: 1.0
     attemptPeriod: 0.1
     solver:
      maxNumIterations: 3
      iterationConvergenceThreshold: 0.0
     problem:
      correctionSampler:
       type: UNIFORM
       parameters:
        delta: 0.1
        correctionType: CUBIC
        sampleType: LINEAR
      solver:
       type: STATIC_LINEAR
       parameters:
        maxNumIterations: 5
        iterationConvergenceThreshold: 0.01
        enableSafetyChecks: false
        dampingFactor: 0.01
    constraints:
      transform:
       type: TRANSFORM_ESTIMATION
       parameters:
        agents:
         default:
          shouldOutputIntrinsics: true
          shouldNormalizeConstraints: &d_calib_should_normalize_constraints false
          metaParameterResidualOptions: &d_calib_meta_param_residual_options
           shouldScaleByUsage: true
           shouldScaleZeroMeanByUsage: true
      imus:
       type: IMU
       parameters:
        agents:
         default:
          shouldOutputIntrinsics: true
          shouldNormalizeConstraints: *d_calib_should_normalize_constraints
          metaParameterResidualOptions: *d_calib_meta_param_residual_options
      gps:
       type: GPS
       parameters:
        agents:
         default:
          shouldComputeFullOffset: false
          # For calibration we have sufficent samples to continuously re-fit and optimize more frequently
          shouldGuessInitialOffsetEachIteration: false
          shouldOptimizeOffset: true
          shouldOptimizeOffsetEachIteration: true
          shouldNormalizeConstraints: *d_calib_should_normalize_constraints
          metaParameterResidualOptions: *d_calib_meta_param_residual_options
          iterations:
           -
            loss:
             type: CAUCHY
             parameters:
              threshold: 1.0
      lasers:
       type: LASER
       parameters:
        agents:
         default:
          shouldOutputIntrinsics: true
          shouldNormalizeConstraints: *d_calib_should_normalize_constraints
          metaParameterResidualOptions: *d_calib_meta_param_residual_options
      saxs:
       type: SIMPLE_SAX
       parameters:
        agents:
         default:
          provider:
           type: BATCHED
           parameters:
            saxizer:
             shouldComputeOffset: true
             shouldFilterSaxsNearEdge: true
             numLevels: 5
             baseResolution: 0.4
             minTimeDelta: 0.025
             maxTimeDelta: &saxMaxTime 0.5
             minWeight: 8
             maxWeight: 1000000
             minCylindricality: 0
             maxCylindricality: 0.8
             minPlanarity: 0.2
             maxPlanarity: 1
             minSphericity: 0
             maxSphericity: 0.5
             maxAngleOfIncidence: 90
        constrainer:
         shouldNormalizeConstraints: *d_calib_should_normalize_constraints
         shouldNormalizeConstraintsWithMatchCounts: false
         dynamic:
          -
           match:
            search: &search
             numMatches: 4
             epsilon: 0.0
             maxDist: 0.8
             shouldScalePositionWithRes: true
             minTimeDelta: *saxMaxTime
             normalScale: 1
             resolutionScale: 100
             maxNumThreads: 4
            shouldFilterReciprocal: true
            minNumMatches: 1000
            maxNumMatches: 10000000
            numMatchesSubsetRatio: 0.1
            maxAngle: 30
           constraint:
            matchScalingMethod: SUMMED_AND_WEIGHT_UNCERTAINTY
            weight: 1.0
            loss:
             type: SOFT
             parameters:
              threshold: 5
          -
           match:
            search: *search
            shouldFilterReciprocal: true
            minNumMatches: 1000
            maxNumMatches: 10000000
            numMatchesSubsetRatio: 0.1
            maxAngle: 15
           constraint:
            matchScalingMethod: SUMMED_AND_WEIGHT_UNCERTAINTY
            weight: 1.0
            loss:
             type: SOFT
             parameters:
              threshold: 3
          -
           match:
            search: *search
            shouldFilterReciprocal: true
            minNumMatches: 1000
            maxNumMatches: 10000000
            numMatchesSubsetRatio: 0.1
            maxAngle: 15
           constraint:
            matchScalingMethod: SUMMED_AND_WEIGHT_UNCERTAINTY
            weight: 1.0
            loss:
             type: SOFT
             parameters:
              threshold: 1


  # Write out the calibration results to a yaml file
  writer:
   type: SIMPLE_WRITER
   parameters:
    writers:
     yaml:
      type: YAML_OVERRIDES_CALIBRATION
      parameters:
       filename: dynamic_calibration.yaml
       shouldOutputNamesInUppercase: true

---
